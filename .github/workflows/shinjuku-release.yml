name: Shinjuku release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    uses: event-horizon-gg/shinjuku-catalog/.github/workflows/release.yml@main
    with:
      build-command: HEIMDALL_ARCH=universal ./build.sh
      app-path: build/Heimdall.app
    secrets:
      catalog-app-id: ${{ secrets.SHINJUKU_CATALOG_APP_ID }}
      catalog-app-key: ${{ secrets.SHINJUKU_CATALOG_APP_KEY }}
